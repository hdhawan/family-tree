<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<style data-ft>
:root{--bg:#f6f3ec;--ink:#24231f;--muted:#6b675e;--line:#b3ab9b;--card:#fffdf8;--edge:#ddd5c4;--accent:#2f5d50;--m:#4a6fa5;--f:#b35a7a;--u:#b9b4a8;--alive:#3b8f57;--dead:#b8453a;--danger:#a33a2b;--serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid #d6cfbf;border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid #e4ded1}
.top h1{font:600 20px/1.2 var(--serif);margin:0;flex:0 1 auto}
.top-actions{display:flex;gap:8px;margin-left:auto}
.search{position:relative;flex:1 1 200px;max-width:360px}
@media(max-width:640px){.search{order:3;flex-basis:100%;max-width:none}}
.btn{border:1px solid #cfc7b6;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b5ac98}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#e0b8b0}
.btn.on{background:#e3ece5;border-color:var(--accent);color:var(--accent)}
.icon-btn{border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
.cust-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;background:#e6eee8;border-bottom:1px solid #d3dfd5}
.cust-bar .btn{padding:6px 10px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.status.dirty{color:var(--danger);font-weight:600}
.banner{background:#fff3cd;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.body{flex:1;display:flex;min-height:0;position:relative}
.tree-area{flex:1;position:relative;display:flex;min-height:0;min-width:0}
.tree-wrap{flex:1;overflow:auto;position:relative;cursor:grab;touch-action:pan-x pan-y}
.tree-wrap.dragging{cursor:grabbing}
.canvas{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lines line{stroke:var(--line);stroke-width:1.5}
.lines line.ex{stroke-dasharray:4 3;stroke-width:2.5;stroke:#7d7666}
.card{position:absolute;background:var(--card);border:2.5px solid var(--u);border-radius:8px;padding:6px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:center;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.st-living{border-color:var(--alive)}
.card.st-deceased{border-color:var(--dead)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--u);vertical-align:-1px;margin:0 4px 0 10px}
.dot.st-living{border-color:var(--alive)}.dot.st-deceased{border-color:var(--dead)}
.card .nm{font:600 14px/1.2 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .yr{font-size:11.5px;line-height:1.25;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.has-cn .nm{-webkit-line-clamp:1}
.card.focus{background:#fff6dc;outline:2px solid #24231f;outline-offset:3px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.card.hi{background:#fffaf0;box-shadow:0 0 0 3px #e9c46a}
.stage.has-sel .card:not(.hi):not(.focus){opacity:.42}
.grp-label{position:absolute;font:600 13px var(--sans);color:var(--muted);white-space:nowrap}
.card.ph{border-style:dashed;background:transparent}
.card.ph .nm{color:var(--muted);font-style:italic}
.tg{position:absolute;left:50%;transform:translateX(-50%);min-width:32px;height:22px;border-radius:11px;border:1px solid #cfc7b6;background:#fff;font:600 12px/20px var(--sans);color:var(--accent);cursor:pointer;padding:0 8px;z-index:2}
.tg:hover{background:#e6eee8}
.tg-down{bottom:-12px}
.tg-up{top:-12px}
.cnt{position:absolute;top:-10px;right:8px;display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:10px;background:#fff;border:1px solid #cfc7b6;font:600 11px/1 var(--sans);color:var(--muted);z-index:2;pointer-events:none}
.cnt svg{width:12px;height:12px}
.cnt.more{background:#24231f;border-color:#24231f;color:#fff}
.legend .cnt{position:static;display:inline-flex;margin:0 3px 0 10px;vertical-align:-4px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:40px;height:40px;border-radius:20px;border:1px solid #cfc7b6;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(246,243,236,.92);padding:6px 10px;border-radius:8px;z-index:4;pointer-events:none}
.side{background:#fffdf8;overflow:auto}
@media(min-width:800px){.side{width:340px;border-left:1px solid #e4ded1;padding:18px}.side.closed{display:none}}
.show-side{position:absolute;top:12px;right:12px;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media(max-width:799px){.show-side{display:none!important}}
.side-toggle{white-space:nowrap;font-size:14px}
@media(max-width:799px){
 .body{flex-direction:column}
 .side{border-top:1px solid #e4ded1;padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-height:58vh;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
 .side.collapsed .side-more{display:none}
 .legend{display:none}
 .zoom{bottom:12px}
}
.side-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.side h3{font:600 21px/1.2 var(--serif);margin:0}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;white-space:pre-wrap}
.rel h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d6cfbf;background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip-yr{color:var(--muted);margin-left:6px;font-size:12px}
.chip.small{font-size:12px;padding:3px 9px;margin-top:6px;color:var(--accent)}
.side-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 10px}
.modal{background:#fffdf8;border-radius:14px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:640px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.modal-head h2{font:600 19px/1.25 var(--serif);margin:0}
.modal-body{padding:12px 16px}
.modal-body p{margin:0 0 10px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.modal-foot:empty{display:none}
.field{display:block;margin-bottom:10px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.hint{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dategrp{display:grid;grid-template-columns:5.5em 1fr 5.5em auto;gap:6px;align-items:center}
.dategrp .approx{display:flex;gap:5px;align-items:center;font-size:14px;white-space:nowrap;cursor:pointer}
.dategrp .approx input{width:auto;margin:0}
@media(max-width:420px){.dategrp{grid-template-columns:5em 1fr 5em}.dategrp .approx{grid-column:1/-1}}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.row3{grid-template-columns:1fr}}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.radios{display:flex;gap:18px;margin:2px 0 10px}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}
.radios input{width:auto;margin:0}
.relsec{border-top:1px solid #e7e1d4;margin-top:8px;padding-top:10px}
.relsec>.lbl{margin-bottom:8px}
.relrow{background:#f3efe5;border-radius:8px;padding:8px;margin-bottom:8px}
.relrow-top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.relrow-top .muted{white-space:nowrap;font-size:13px}
.picker{position:relative}
.pk-list{position:absolute;left:0;right:0;top:100%;z-index:6;background:#fff;border:1px solid #d6cfbf;border-radius:8px;margin-top:2px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.pk-item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #f0ebe0;background:#fff;padding:9px 10px;cursor:pointer;color:var(--ink)}
.pk-item:hover,.pk-item:focus{background:#f3efe5}
.pk-empty{padding:9px 10px;color:var(--muted);font-size:13px}
.pk-pill{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#fff;border:1px solid var(--accent);border-radius:8px;padding:5px 4px 5px 10px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.warn{background:#fff3cd;border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#24231f;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.box{border:1px solid #e4ded1;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.box h4{margin:0 0 2px;font:600 15px var(--serif)}
.pend{border:1px solid #d6cfbf;border-radius:12px;padding:10px 12px 12px;margin-bottom:14px;background:#fbf8f1}
.pend-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:14px;cursor:pointer}
.opt input{width:auto;margin:3px 0 0}
.empty{padding:60px 20px;text-align:center;color:var(--muted);max-width:420px;margin:0 auto}
.start{max-width:460px;margin:60px auto;padding:20px}
.start h1{font:600 26px var(--serif)}
.curr{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0}
.curr.removed span{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="embedded-data" data-ft></script>
<script data-ft>
'use strict';
/* Family tree — single-file, no server. Data lives in family.json (or embedded above in an offline copy). */
const W=164,H=60,GX=18,GY=58,PG=26,PAD=50;
const FIELDS=['given','middleName','commonName','surname','birthSurname','sex','born','died','notes'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const REL_TYPES=[['child','is a child of'],['parent','is a parent of'],['partner','is the spouse / partner of'],['expartner','is a former spouse / partner of'],['sibling','is a brother / sister of'],['cousin-m','is a cousin brother of'],['cousin-f','is a cousin sister of']];
const isCousin=t=>t==='cousin-m'||t==='cousin-f';
/* which side a cousin is on: one of the person's aunts/uncles, or a parent's side where that aunt/uncle isn't in the tree yet */
function sideOf(q){const x=P(q)&&P(q).sex;return x==='M'?'Paternal':x==='F'?'Maternal':null;}
function cousinVia(t){
  const T=P(t);if(!T)return[['',"Their parents aren't in the tree yet"]];
  const ps=sortParents(T.parents.filter(P)),opts=[];
  for(const q of ps){
    const sd=sideOf(q),side=sd?`${sd} (${sd==='Paternal'?"father's":"mother's"} side)`:`Through ${dname(P(q))}`,who=sd?(sd==='Paternal'?'father':'mother'):dname(P(q));
    for(const u of siblingsOf(q)){
      if(isPh(u)){const k=childrenOf(u).map(x=>dname(P(x)));if(k.length)opts.push(['p:'+u,`${side}: same parent as ${k.join(', ')}`]);}
      else opts.push(['p:'+u,`${side}: child of ${dname(P(u))}, ${who}'s ${P(u).sex==='F'?'sister':P(u).sex==='M'?'brother':'sibling'}`]);
    }
    opts.push(['q:'+q,`${side}: their parent isn't in the tree yet`]);
  }
  if(ps.length<2){
    if(!ps.some(q=>P(q).sex==='M'))opts.push(['side:M',"Paternal (father's side): their parent isn't in the tree yet"]);
    if(!ps.some(q=>P(q).sex==='F'))opts.push(['side:F',"Maternal (mother's side): their parent isn't in the tree yet"]);
  }
  return opts.sort((a,b)=>a[1].startsWith('Maternal')-b[1].startsWith('Maternal'));
}
function viaText(r){
  if(!r||!isCousin(r.type)||!r.via)return'';
  if(r.via==='side:M')return' (paternal)';if(r.via==='side:F')return' (maternal)';
  const id=r.via.slice(2);if(!P(id))return'';
  if(r.via[0]==='q'){const sd=sideOf(id);return sd?` (${sd.toLowerCase()})`:` (${dname(P(id))}'s side)`;}
  const T=P(r.target),q=T&&T.parents.find(x=>P(x)&&siblingsOf(x).includes(id)),sd=q&&sideOf(q);
  return ` (${sd?sd.toLowerCase()+', ':''}${isPh(id)?'parent not in the tree yet':'child of '+dname(P(id))})`;
}
function cousinsOf(id){
  const out=new Map();
  for(const q of sortParents(P(id).parents.filter(P))){
    const label=sideOf(q)?sideOf(q)+' cousins':`Cousins through ${dname(P(q))}`;if(!out.has(label))out.set(label,new Set());
    for(const u of siblingsOf(q))for(const c of childrenOf(u))if(c!==id)out.get(label).add(c);
  }
  return[...out].filter(([,v])=>v.size).map(([k,v])=>[k,sortByBirth([...v])]);
}
/* storage keys ignore index.html / trailing-slash differences, so …/family-tree/ and …/family-tree/index.html share the same saved token and drafts */
const PAGE_PATH=(()=>{let p=location.pathname.replace(/[^/]*\.html?$/i,'');if(!p.endsWith('/'))p+='/';return p;})();
const DRAFT_KEY='ft-draft:'+PAGE_PATH;
let DATA=null,KIDS={},custodian=false,dirty=false,loadedStamp=null;
const S={focus:null,up:new Set(),down:new Set(),zoom:1,view:'focus',allFit:false,allSel:null};

/* ---------- tiny DOM helper ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return e;
}
const btn=(text,fn,cls)=>h('button',{type:'button',class:'btn'+(cls?' '+cls:''),onclick:fn,text});
function toast(msg,ms=3200){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);}

/* ---------- data helpers ---------- */
const P=id=>DATA&&id?DATA.people[id]:null;
function emptyData(){return{format:'family-tree/1',title:'Our Family Tree',updated:null,home:null,custodians:[],imported:[],people:{}};}
function normalize(d){
  const o=Object.assign(emptyData(),d||{});
  if(!o.people||typeof o.people!=='object')o.people={};
  for(const [id,p] of Object.entries(o.people)){
    if(!p||typeof p!=='object'){delete o.people[id];continue;}
    p.id=id;
    for(const k of FIELDS)p[k]=typeof p[k]==='string'?p[k]:'';
    p.status=['living','deceased','unknown'].includes(p.status)?p.status:(p.deceased?'deceased':'living');
    p.deceased=p.status==='deceased';p.placeholder=!!p.placeholder;
  }
  for(const p of Object.values(o.people)){
    p.parents=[...new Set(Array.isArray(p.parents)?p.parents.filter(x=>o.people[x]&&x!==p.id):[])].slice(0,2);
    p.partners=[...new Set(Array.isArray(p.partners)?p.partners.filter(x=>o.people[x]&&x!==p.id):[])];
  }
  for(const p of Object.values(o.people))for(const q of p.partners)if(!o.people[q].partners.includes(p.id))o.people[q].partners.push(p.id);
  for(const p of Object.values(o.people))p.ex=[...new Set(Array.isArray(p.ex)?p.ex.filter(x=>p.partners.includes(x)):[])];
  for(const p of Object.values(o.people))for(const q of p.ex)if(!o.people[q].ex.includes(p.id))o.people[q].ex.push(p.id);
  if(!Array.isArray(o.custodians))o.custodians=[];
  if(!Array.isArray(o.imported))o.imported=[];
  if(!o.vault||typeof o.vault.salt!=='string'||typeof o.vault.check!=='string')delete o.vault;
  for(const p of Object.values(o.people))if(typeof p.priv!=='string')delete p.priv;
  if(typeof o.title!=='string'||!o.title.trim())o.title='Our Family Tree';
  return o;
}
function rebuildIndex(){KIDS={};for(const p of Object.values(DATA.people))for(const q of p.parents)(KIDS[q]=KIDS[q]||[]).push(p.id);}
const childrenOf=id=>KIDS[id]||[];
function partnersOf(id){
  const p=P(id);if(!p)return[];
  const set=new Set(p.partners.filter(P));
  for(const c of childrenOf(id))for(const q of P(c).parents)if(q!==id)set.add(q);
  return [...set].sort((a,b)=>isEx(id,a)-isEx(id,b));
}
function siblingsOf(id){
  const p=P(id);const s=new Set();
  for(const q of p.parents)for(const c of childrenOf(q))if(c!==id)s.add(c);
  return sortByBirth([...s]);
}
function year(d){const m=/(\d{4})/.exec(d||'');return m?+m[1]:null;}
function stat(p){if(!p||p.placeholder)return'unknown';const b=year(p.born);if(p.status!=='deceased'&&b&&new Date().getFullYear()-b>110)return'deceased';return p.status||'unknown';}
/* 'unknown' is treated like living for privacy (birth year only) */
function isLiving(p){return stat(p)!=='deceased';}
const STATUS_LABEL={living:'Living',deceased:'Deceased',unknown:'Not known'};
/* dname: what the family calls them (common name + surname); fullName: legal name with common name in quotes */
function dname(p){if(!p)return'Unknown';if(p.commonName&&!p.placeholder)return p.commonName;return name(p);}
function fullName(p){if(!p)return'Unknown';if(p.placeholder&&!p.given)return name(p);return[p.given,p.middleName,p.commonName?'“'+p.commonName+'”':'',p.surname].filter(Boolean).join(' ');}
function name(p){if(!p)return'Unknown';if(p.placeholder&&!p.given)return p.sex==='M'?'Unknown father':p.sex==='F'?'Unknown mother':'Unknown parent';return[p.given,p.surname].filter(Boolean).join(' ')||'Unnamed';}
/* dates are stored as [~]YYYY[-MM[-DD]] ("~" = approximate year) or, when the year is unknown, --MM[-DD] */
function dparts(v){
  if(!v)return null;let ap=false;if(v[0]==='~'){ap=true;v=v.slice(1);}let m;
  let r=null;
  if(m=/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(v))r={ap,y:+m[1],m:m[2]?+m[2]:null,d:m[3]?+m[3]:null};
  else if(m=/^--(\d{2})(?:-(\d{2}))?$/.exec(v))r={ap:false,y:null,m:+m[1],d:m[2]?+m[2]:null};
  if(!r||(r.m!==null&&(r.m<1||r.m>12))||(r.d!==null&&(r.d<1||r.d>new Date(r.y||2000,r.m,0).getDate())))return null;
  return r;
}
function dstr(p){
  if(!p||(!p.y&&!p.m))return'';
  const mm=p.m?String(p.m).padStart(2,'0'):'',dd=p.d&&p.m?String(p.d).padStart(2,'0'):'';
  if(p.y)return(p.ap?'~':'')+p.y+(mm?'-'+mm+(dd?'-'+dd:''):'');

/* merge one person into another: used to fill in an "Unknown parent" or to fix a duplicate */

  for(const q of S_.parents)if(D.parents.length<2&&!D.parents.includes(q)&&q!==dst)D.parents.push(q);
  for(const q of S_.partners)if(q!==dst&&P(q)){isEx(src,q)?setEx(dst,q,true):linkPartners(dst,q);}
  if(!S_.placeholder){for(const k of FIELDS)if(!D[k]&&S_[k])D[k]=S_[k];if(D.status==='unknown'&&S_.status!=='unknown'){D.status=S_.status;D.deceased=S_.deceased;}if(!D.priv&&S_.priv){D.priv=S_.priv;if(PRIV[src])PRIV[dst]=PRIV[src];}}

    if(!r.ok)throw new Error(await relayErr(r));

async function putTo(kind,text,sha,msg){

    if(r.status===409)return'conflict';
    if(r.status===401){setPass('');RELAY_WHO='';throw new Error('Your custodian password was not accepted. Sign in again.');}
    if(!r.ok)throw new Error(await relayErr(r));
    return'ok';
  }

  if(r.status===409||r.status===422)return'conflict';

    const w=await relayWhoami();
    if(w===false&&!await askPassword())return;
    if(w===null)toast(RELAY_DOWN,6000);
  }
  custodian=!custodian;$('#cust-bar').hidden=!custodian;
  const b=$('#cust-btn');b.classList.toggle('on',custodian);b.textContent=custodian?'Exit custodian':'Custodian';
  if(custodian){
    const k=pubKind();
    if(k==='relay'){refreshLatest();refreshPending();toast((RELAY_WHO?'Signed in as '+RELAY_WHO+'. ':'')+'New additions wait under Pending. Publish saves your changes for everyone.',5000);}
    else if(k==='github'){if(getTok())refreshLatest();toast('Custodian mode: tap Publish when you are done to save your changes to GitHub.',5000);}
    else toast('Custodian mode: edits stay on this device until you save family.json and put it on the website.',5000);
  }
  updateStatus();renderTree();renderSide();
}
function markDirty(){
  dirty=true;updateStatus();
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),base:loadedStamp,baseData:BASE,data:DATA}));}catch(e){}
}
function updateStatus(){
  const s=$('#status');if(!s)return;const k=pubKind();
  s.textContent=(k==='relay'&&RELAY_WHO?`Signed in as ${RELAY_WHO} · `:'')+(dirty?(k?'Unpublished changes — tap Publish':'Unsaved changes — save family.json and publish it'):'No unpublished changes');
  s.classList.toggle('dirty',dirty);
  const pb=$('#publish-btn');if(pb)pb.hidden=!k;
  const sb=$('#save-btn');if(sb){sb.textContent=k?'Download backup':'Save family.json';sb.classList.toggle('primary',!k);}
  updatePendingBtn();
}
function checkDraft(){
  let d=null;try{d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');}catch(e){}
  if(!d||!d.data)return;
  const b=$('#banner');b.innerHTML='';b.hidden=false;
  const older=d.base!==loadedStamp;
  b.append(h('span',{text:`Unsaved custodian changes from ${new Date(d.at).toLocaleString()} were found on this device.${older?' The published tree has changed since then, so restoring will replace it.':''}`}),
    btn('Restore them',()=>{DATA=normalize(d.data);if(d.baseData)BASE=normalize(d.baseData);rebuildIndex();dirty=true;b.hidden=true;if(!custodian)toggleCustodian();updateStatus();setFocus(P(S.focus)?S.focus:pickHome());}),
    btn('Discard',()=>{try{localStorage.removeItem(DRAFT_KEY);}catch(e){}b.hidden=true;}));
}
function afterChange(focusId){

function openEditPerson(id,prefill){
  const p=id?P(id):null;
  const removals=new Set(),pstate={};
  const treeEmpty=!Object.keys(DATA.people).length;
  const form=personForm(p?Object.assign({},p,{priv:PRIV[id]}):{},{privLocked:!!(p&&p.priv&&!KEY),pool:()=>treePool(id),requireRel:!p&&!treeEmpty,allowBlankName:p&&p.placeholder,relTitle:p?'Add relationships':'Where do they fit?',rels:!p&&prefill&&P(prefill)?[{type:'',target:prefill}]:[]});
  const m=modal(p?'Edit '+name(p):'Add a person',{wide:true,sticky:true});
  let cur=null;
  if(p){
    const rows=[];
    const add=(label,key,oid)=>{const r=h('div',{class:'curr'},h('span',{text:label+': '+fullName(P(oid))}),h('button',{type:'button',class:'icon-btn',text:'✕','aria-label':'Remove',onclick:()=>{removals.has(key)?removals.delete(key):removals.add(key);r.classList.toggle('removed');}}));rows.push(r);};
    p.parents.forEach(x=>add('Parent','parent:'+x,x));
    partnersOf(id).forEach(x=>{
      const init=isEx(id,x)?'ex':'cur';pstate[x]={init,now:init};
      const sel=h('select',{style:'width:auto;padding:4px 8px'},h('option',{value:'cur',text:'Together'}),h('option',{value:'ex',text:'Divorced / separated'}),h('option',{value:'rm',text:'Remove this link'}));
      sel.value=init;sel.addEventListener('change',()=>{pstate[x].now=sel.value;});
      rows.push(h('div',{class:'curr'},h('span',{text:'Spouse / partner: '+fullName(P(x))}),sel));
    });
    childrenOf(id).forEach(x=>add('Child','child:'+x,x));
    if(rows.length)cur=h('div',{class:'box'},h('div',{class:'lbl',text:'Current relationships'}),rows);
  }
  let dupWarned=false;
  m.set([form.el,cur],[btn('Cancel',m.close),btn('Save',save,'primary')]);
  if(cur)form.el.insertBefore(cur,form.el.querySelector('.relsec'));
  async function save(){
    const r=form.read();if(!r)return;
    if(hasPriv(r.priv)&&!await ensureKey()){form.showErr('Contact details are saved encrypted, so they need the family passphrase. Clear them, or set or enter the passphrase.');return;}
    if(!p&&!dupWarned){const d=findDups(r.person);if(d.length){dupWarned=true;form.showErr(`${d.map(i=>fullName(P(i))).join(', ')} may already be in the tree. Save again to add anyway.`);return;}}
    let pid;
    if(p){Object.assign(p,cleanFields(r.person));if(p.placeholder&&p.given)p.placeholder=false;pid=id;
      for(const k of removals){const [t,o]=k.split(':');
        if(t==='parent')p.parents=p.parents.filter(x=>x!==o);
        if(t==='child'&&P(o))P(o).parents=P(o).parents.filter(x=>x!==id);}
      for(const [o,st] of Object.entries(pstate)){
        if(st.now===st.init||!P(o))continue;
        const who=fullName(P(o)),kids=sharedKids(id,o).length;
        if(st.now==='cur')setEx(id,o,false);
        else if(kids)setEx(id,o,true); // with children together they stay linked, shown dotted
        else{
          // divorced with no children together, or link removed: offer to drop them from the tree
          const others=()=>{const q=P(o);return q.parents.length>0||childrenOf(o).length>0||q.partners.some(z=>z!==id);};
          const opts=[['drop',others()?`Remove the link (${who} stays, as they're connected to other people)`:`Remove ${who} from the tree`]];
          if(st.now==='ex')opts.push(['keep','Keep as a former spouse (dotted line)']);
          else opts.unshift(['cancel','Keep the link']);
          const pick=await choose(st.now==='ex'?`${name(p)} and ${who} have no children together.`:`Remove the link between ${name(p)} and ${who}?`,opts);
          if(pick==='keep')setEx(id,o,true);
          else if(pick==='drop'){unlinkPartners(id,o);if(!isConnected(o))purge(o);}
        }
      }
    }else pid=createPerson(r.person);
    if(r.priv!==undefined&&(hasPriv(r.priv)||P(pid).priv))await setPriv(pid,r.priv);
    const warns=[];r.rels.forEach(x=>applyRel(pid,x.type,x.target,warns,x.via));
    if(treeEmpty)DATA.home=pid;
    m.close();afterChange(pid);
    if(warns.length)toast(warns.join(' '),7000);
  }
}
async function deletePerson(id){
  const p=P(id);
  if(!await confirmBox(`Delete ${name(p)}? Their links to other people are removed too. This can't be undone unless you discard the unsaved changes.`,'Delete',true))return;
  purge(id);
  const next=p.parents.find(P)||p.partners.find(P)||(KIDS[id]||[]).find(P)||null;
  rebuildIndex();
  afterChange(next||pickHome());
}
/* one submission, for review: who sent it and, per person, add as new / same as someone already here / skip */
function subReview(s,choices){
  const done=DATA.imported.includes(s.sid),out=[];
  out.push(h('div',{class:'lbl',style:'margin-top:4px',text:`From ${s.by||'(no name)'} · ${String(s.receivedAt||s.at||'').slice(0,10)} · ${s.people.length} ${s.people.length===1?'person':'people'}`}));
  if(done)out.push(h('div',{class:'warn',text:'This one was already added to the tree before. It is set to skip.'}));
  s.people.forEach((p,j)=>{
    const key=s.sid+'|'+p.tmp,d=findDups(p),exact=d.find(i=>P(i).born&&P(i).born===p.born);
    choices[key]=done?'skip':exact||'new';
    const rn='r'+s.sid+'_'+j;
    const opt=(val,label)=>h('label',{class:'opt'},h('input',{type:'radio',name:rn,checked:choices[key]===val,onchange:()=>{choices[key]=val;}}),h('span',{text:label}));
    const ls=lifespan(Object.assign({placeholder:false},p));
    out.push(h('div',{class:'box'},
      h('h4',{text:[p.given,p.middleName,p.commonName?'“'+p.commonName+'”':'',p.surname].filter(Boolean).join(' ')+(p.birthSurname?` (née ${p.birthSurname})`:'')}),
      h('div',{class:'muted',text:[STATUS_LABEL[p.status]||'Not known',ls,(p.rels||[]).map(r=>relLabel(r.type)+' '+targetName(r.target,s)+viaText(r)).join('; ')||'No relationship given, so link them with Edit after adding'].filter(Boolean).join(' · ')}),
      p.notes?h('div',{class:'muted',text:'Notes: '+p.notes}):null,
      hasPriv(p.priv)?h('div',{class:'muted',text:'Private: '+[p.priv.residence,p.priv.phone,p.priv.email].filter(Boolean).join(' · ')}):null,
      opt('new','Add as a new person'),
      d.map(i=>opt(i,`Same person as ${fullName(P(i))}${lifespan(P(i))?' ('+lifespan(P(i))+')':''}: keep them and just add the relationships and any missing details`)),
      opt('skip','Skip')));
  });
  return out;
}
/* put reviewed submissions into the tree; null if a needed passphrase wasn't given */
async function applySubs(subs,choices){
  const needs=subs.some(s=>s.people.some(p=>choices[s.sid+'|'+p.tmp]!=='skip'&&hasPriv(p.priv)));
  if(needs&&!await ensureKey()){toast('Some people include contact details, which need the family passphrase. Set or enter it, then try again.',6000);return null;}
  const warns=[];let added=0,first=null;
  for(const s of subs){
    const map={},pend=[];
    s.people.forEach(p=>{const c=choices[s.sid+'|'+p.tmp];if(c==='skip')return;
      if(c==='new'||!P(c)){map[p.tmp]=createPerson(p);added++;if(hasPriv(p.priv))pend.push([map[p.tmp],cleanPriv(p.priv)]);}
      else{const e=P(c),f=cleanFields(p);for(const k of FIELDS)if(!e[k]&&f[k])e[k]=f[k];if(f.status&&f.status!=='unknown'&&e.status==='unknown'){e.status=f.status;e.deceased=f.status==='deceased';}map[p.tmp]=c;if(hasPriv(p.priv)){const o=Object.assign({},PRIV[c]||{}),nn=cleanPriv(p.priv);for(const k in nn)if(!o[k]&&nn[k])o[k]=nn[k];pend.push([c,o]);}}
      first=first||map[p.tmp];});
    s.people.forEach(p=>{const a=map[p.tmp];if(!a)return;
      (Array.isArray(p.rels)?p.rels:[]).forEach(r=>{const b=/^n\d+$/.test(r.target)?map[r.target]:(P(r.target)?r.target:null);
        if(!b){warns.push(`${name(P(a))}: the person they're related to (${relLabel(r.type)}) wasn't found or was skipped.`);return;}
        applyRel(a,r.type,b,warns,typeof r.via==='string'?r.via:'');});});
    for(const [pid,o] of pend)await setPriv(pid,o);
    if(!DATA.imported.includes(s.sid))DATA.imported.push(s.sid);
  }
  DATA.imported=DATA.imported.slice(-2000);
  afterChange(first);
  return{added,warns,first};
}
function openImport(){
  const ta=h('textarea',{rows:6,placeholder:'Paste one or more messages relatives sent you…'});
  const m=modal('Import submissions',{wide:true,sticky:true});
  m.set([h('p',{class:'muted',text:'Paste the messages relatives sent you, several at once if you like. Each code starts with FT1. and other text is ignored. You review everything before it goes into the tree.'}),ta],[btn('Cancel',m.close),btn('Review',review,'primary')]);
  function review(){
    const toks=ta.value.match(/FT1\.[A-Za-z0-9_-]+/g)||[];
    if(!toks.length){toast('No codes found. They start with FT1.');return;}
    const subs=[],bad=[],sids=new Set();
    toks.forEach((t,i)=>{try{const s=JSON.parse(b64d(t.slice(4)));if(!s||!Array.isArray(s.people)||typeof s.sid!=='string')throw 0;if(sids.has(s.sid))return;sids.add(s.sid);s.people=s.people.filter(p=>p&&/^n\d+$/.test(p.tmp));subs.push(s);}catch(e){bad.push(i+1);}});
    const choices={},secs=[];
    subs.forEach(s=>secs.push(...subReview(s,choices)));
    if(bad.length)secs.unshift(h('div',{class:'warn',text:`${bad.length} code(s) couldn't be read. They may have been cut off when copied.`}));
    m.set(secs,[btn('Back',()=>{m.close();openImport();}),btn('Add to tree',()=>apply(subs,choices),'primary')]);
  }
  async function apply(subs,choices){
    const res=await applySubs(subs,choices);if(!res)return;
    m.set([h('p',{text:`Added ${res.added} new ${res.added===1?'person':'people'}.`}),res.warns.length?h('div',{class:'warn'},res.warns.map(w=>h('div',{text:w}))):null,
      h('p',{class:'muted',text:pubKind()?'Tap Publish so everyone sees the changes.':'Remember to save family.json and put it on the website so everyone sees the changes.'})],[btn('Done',m.close,'primary')]);
  }
}

async function saveFile(filename,text,mime){
  if(window.claude&&typeof window.claude.use==='function'){
    try{const d=await window.claude.use('downloads');if(d){await d.save({filename,data:text});return true;}}catch(e){}

  catch(e){showCopy(filename,text);return false;}
}

function gdate(v){const p=dparts(v);if(!p)return'';
  if(!p.y)return`(${p.d?p.d+' ':''}${MON_FULL[p.m-1]}, year unknown)`;
  return(p.ap?'ABT ':'')+(p.d?p.d+' ':'')+(p.m?MON[p.m-1].toUpperCase()+' ':'')+p.y;}
function toGedcom(){
  const g=s=>String(s||'').replace(/[\r\n]+/g,' ').replace(/@/g,'@@').trim();
  const ids=Object.keys(DATA.people),xi={};ids.forEach((id,i)=>xi[id]='@I'+(i+1)+'@');
  const fams=new Map(),fk=(a,b)=>b?[a,b].sort().join('+'):a+'+';
  const fam=(a,b)=>{const k=fk(a,b);if(!fams.has(k))fams.set(k,{a,b,kids:[]});return fams.get(k);};
  ids.forEach(id=>{const p=P(id),ps=p.parents.filter(P);if(ps.length)fam(ps[0],ps[1]).kids.push(id);p.partners.filter(P).forEach(q=>{if(id<q)fam(id,q);});});
  const fx=new Map(),famsOf={},famcOf={};let i=0;
  fams.forEach((f,k)=>{const x='@F'+(++i)+'@';fx.set(k,x);[f.a,f.b].filter(Boolean).forEach(s=>(famsOf[s]=famsOf[s]||[]).push(x));f.kids.forEach(c=>(famcOf[c]=famcOf[c]||[]).push(x));});
  const L=['0 HEAD','1 SOUR FAMILYTREEPAGE','2 NAME Family Tree Page','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 DATE '+gdate(new Date().toISOString().slice(0,10))];
  ids.forEach(id=>{const p=P(id),gv=g(p.given)||(p.placeholder?'Unknown':'');
    const gvm=[gv,g(p.middleName)].filter(Boolean).join(' ');
    L.push(`0 ${xi[id]} INDI`,`1 NAME ${gvm} /${g(p.surname)}/`);
    if(p.given)L.push('2 GIVN '+gvm);if(p.commonName)L.push('2 NICK '+g(p.commonName));if(p.surname)L.push('2 SURN '+g(p.surname));
    if(p.birthSurname&&p.birthSurname!==p.surname)L.push(`1 NAME ${gvm} /${g(p.birthSurname)}/`,'2 TYPE birth');
    L.push('1 SEX '+(p.sex==='M'||p.sex==='F'?p.sex:'U'));
    if(p.born)L.push('1 BIRT','2 DATE '+gdate(p.born));
    if(p.died)L.push('1 DEAT','2 DATE '+gdate(p.died));else if(stat(p)==='deceased')L.push('1 DEAT Y');
    if(p.notes){const ls=p.notes.split(/\r?\n/);L.push('1 NOTE '+ls[0].replace(/@/g,'@@'));ls.slice(1).forEach(l=>L.push('2 CONT '+l.replace(/@/g,'@@')));}
    const pr=PRIV[id];if(pr&&hasPriv(pr)){L.push('1 RESI');if(pr.residence)L.push('2 PLAC '+g(pr.residence));if(pr.phone)L.push('2 PHON '+g(pr.phone));if(pr.email)L.push('2 EMAIL '+g(pr.email));}
    (famcOf[id]||[]).forEach(x=>L.push('1 FAMC '+x));(famsOf[id]||[]).forEach(x=>L.push('1 FAMS '+x));});
  fams.forEach((f,k)=>{L.push(`0 ${fx.get(k)} FAM`);let hu=null,wi=null;
    [f.a,f.b].filter(Boolean).forEach(s=>{if(P(s).sex==='F'&&!wi)wi=s;else if(!hu)hu=s;else wi=s;});
    if(hu)L.push('1 HUSB '+xi[hu]);if(wi)L.push('1 WIFE '+xi[wi]);if(f.a&&f.b&&isEx(f.a,f.b))L.push('1 DIV Y');f.kids.forEach(c=>L.push('1 CHIL '+xi[c]));});
  L.push('0 TRLR');return L.join('\r\n')+'\r\n';
}

function startScreen(msg){
  const app=$('#app');app.innerHTML='';
  const file=h('input',{type:'file',accept:'.json,application/json'});
  file.addEventListener('change',async()=>{const f=file.files[0];if(!f)return;try{init(JSON.parse(await f.text()));}catch(e){err.textContent='That file could not be read as a family tree.';}});
  const err=h('p',{class:'err'});
  app.append(h('div',{class:'start'},h('h1',{text:'Family Tree'}),
    h('p',{text:msg||'The tree data (family.json) could not be loaded. If you opened this page from a file on your computer, choose the family.json file:'}),file,err,
    h('p',{class:'muted',style:'margin-top:24px',text:'Or start from scratch:'}),btn('Start a new, empty tree',()=>{init(emptyData());toggleCustodian();openEditPerson(null);})),
    h('div',{id:'modal-root'}),h('div',{id:'toast',class:'toast'}));
}
function init(data){
  if(window.innerWidth<500)S.zoom=.85;
  DATA=normalize(data);BASE=clone(DATA);loadedStamp=DATA.updated||null;rebuildIndex();shell();document.title=DATA.title;
  const hid=decodeURIComponent(location.hash.slice(1));
  const start=P(hid)?hid:pickHome();
  if(hid==='all'&&start){S.view='all';S.focus=start;updateViewBtn();renderAll();renderSide();}
  else if(start)setFocus(start);else{renderTree();renderSide();}
  checkDraft();
}
window.addEventListener('hashchange',()=>{if(!DATA)return;const id=decodeURIComponent(location.hash.slice(1));
  if(id==='all'){if(S.view!=='all')openAll();return;}
  if(P(id)&&(S.view==='all'||id!==S.focus)){S.view='focus';updateViewBtn();setFocus(id);}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
(async function boot(){
  let data=null;
  const emb=$('#embedded-data').textContent.trim();
  if(emb){try{data=JSON.parse(emb);}catch(e){}}
  if(!data){try{const r=await fetch('family.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}}
  if(data)init(data);else startScreen();
})();
</script>
</body>
</html>
