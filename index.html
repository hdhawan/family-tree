<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<style data-ft>
:root{--bg:#f6f3ec;--ink:#24231f;--muted:#6b675e;--line:#b3ab9b;--card:#fffdf8;--edge:#ddd5c4;--accent:#2f5d50;--m:#4a6fa5;--f:#b35a7a;--u:#b9b4a8;--alive:#3b8f57;--dead:#b8453a;--danger:#a33a2b;--serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid #d6cfbf;border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid #e4ded1}
.top h1{font:600 20px/1.2 var(--serif);margin:0;flex:0 1 auto}
.top-actions{display:flex;gap:8px;margin-left:auto}
.search{position:relative;flex:1 1 200px;max-width:360px}
@media(max-width:640px){.search{order:3;flex-basis:100%;max-width:none}}
.btn{border:1px solid #cfc7b6;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b5ac98}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#e0b8b0}
.btn.on{background:#e3ece5;border-color:var(--accent);color:var(--accent)}
.icon-btn{border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
.cust-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;background:#e6eee8;border-bottom:1px solid #d3dfd5}
.cust-bar .btn{padding:6px 10px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.status.dirty{color:var(--danger);font-weight:600}
.banner{background:#fff3cd;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.body{flex:1;display:flex;min-height:0;position:relative}
.tree-area{flex:1;position:relative;display:flex;min-height:0;min-width:0}
.tree-wrap{flex:1;overflow:auto;position:relative;cursor:grab;touch-action:pan-x pan-y}
.tree-wrap.dragging{cursor:grabbing}
.canvas{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lines line{stroke:var(--line);stroke-width:1.5}
.lines line.ex{stroke-dasharray:4 3;stroke-width:2.5;stroke:#7d7666}
.card{position:absolute;background:var(--card);border:2.5px solid var(--u);border-radius:8px;padding:6px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:center;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.st-living{border-color:var(--alive)}
.card.st-deceased{border-color:var(--dead)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--u);vertical-align:-1px;margin:0 4px 0 10px}
.dot.st-living{border-color:var(--alive)}.dot.st-deceased{border-color:var(--dead)}
.card .nm{font:600 14px/1.2 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .yr{font-size:11.5px;line-height:1.25;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.has-cn .nm{-webkit-line-clamp:1}
.card.focus{background:#fff6dc;outline:2px solid #24231f;outline-offset:3px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.card.hi{background:#fffaf0;box-shadow:0 0 0 3px #e9c46a}
.stage.has-sel .card:not(.hi):not(.focus){opacity:.42}
.grp-label{position:absolute;font:600 13px var(--sans);color:var(--muted);white-space:nowrap}
.card.ph{border-style:dashed;background:transparent}
.card.ph .nm{color:var(--muted);font-style:italic}
.tg{position:absolute;left:50%;transform:translateX(-50%);min-width:32px;height:22px;border-radius:11px;border:1px solid #cfc7b6;background:#fff;font:600 12px/20px var(--sans);color:var(--accent);cursor:pointer;padding:0 8px;z-index:2}
.tg:hover{background:#e6eee8}
.tg-down{bottom:-12px}
.tg-up{top:-12px}
.cnt{position:absolute;top:-10px;right:8px;display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:10px;background:#fff;border:1px solid #cfc7b6;font:600 11px/1 var(--sans);color:var(--muted);z-index:2;pointer-events:none}
.cnt svg{width:12px;height:12px}
.cnt.more{background:#24231f;border-color:#24231f;color:#fff}
.legend .cnt{position:static;display:inline-flex;margin:0 3px 0 10px;vertical-align:-4px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:40px;height:40px;border-radius:20px;border:1px solid #cfc7b6;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(246,243,236,.92);padding:6px 10px;border-radius:8px;z-index:4;pointer-events:none}
.side{background:#fffdf8;overflow:auto}
@media(min-width:800px){.side{width:340px;border-left:1px solid #e4ded1;padding:18px}.side.closed{display:none}}
.show-side{position:absolute;top:12px;right:12px;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media(max-width:799px){.show-side{display:none!important}}
.side-toggle{white-space:nowrap;font-size:14px}
@media(max-width:799px){
 .body{flex-direction:column}
 .side{border-top:1px solid #e4ded1;padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-height:58vh;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
 .side.collapsed .side-more{display:none}
 .legend{display:none}
 .zoom{bottom:12px}
}
.side-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.side h3{font:600 21px/1.2 var(--serif);margin:0}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;white-space:pre-wrap}
.rel h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d6cfbf;background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip-yr{color:var(--muted);margin-left:6px;font-size:12px}
.chip.small{font-size:12px;padding:3px 9px;margin-top:6px;color:var(--accent)}
.side-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 10px}
.modal{background:#fffdf8;border-radius:14px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:640px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.modal-head h2{font:600 19px/1.25 var(--serif);margin:0}
.modal-body{padding:12px 16px}
.modal-body p{margin:0 0 10px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.modal-foot:empty{display:none}
.field{display:block;margin-bottom:10px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.hint{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dategrp{display:grid;grid-template-columns:5.5em 1fr 5.5em auto;gap:6px;align-items:center}
.dategrp .approx{display:flex;gap:5px;align-items:center;font-size:14px;white-space:nowrap;cursor:pointer}
.dategrp .approx input{width:auto;margin:0}
@media(max-width:420px){.dategrp{grid-template-columns:5em 1fr 5em}.dategrp .approx{grid-column:1/-1}}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.row3{grid-template-columns:1fr}}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.radios{display:flex;gap:18px;margin:2px 0 10px}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}
.radios input{width:auto;margin:0}
.relsec{border-top:1px solid #e7e1d4;margin-top:8px;padding-top:10px}
.relsec>.lbl{margin-bottom:8px}
.relrow{background:#f3efe5;border-radius:8px;padding:8px;margin-bottom:8px}
.relrow-top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.relrow-top .muted{white-space:nowrap;font-size:13px}
.picker{position:relative}
.pk-list{position:absolute;left:0;right:0;top:100%;z-index:6;background:#fff;border:1px solid #d6cfbf;border-radius:8px;margin-top:2px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.pk-item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #f0ebe0;background:#fff;padding:9px 10px;cursor:pointer;color:var(--ink)}
.pk-item:hover,.pk-item:focus{background:#f3efe5}
.pk-empty{padding:9px 10px;color:var(--muted);font-size:13px}
.pk-pill{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#fff;border:1px solid var(--accent);border-radius:8px;padding:5px 4px 5px 10px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.warn{background:#fff3cd;border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#24231f;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.box{border:1px solid #e4ded1;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.box h4{margin:0 0 2px;font:600 15px var(--serif)}
.pend{border:1px solid #d6cfbf;border-radius:12px;padding:10px 12px 12px;margin-bottom:14px;background:#fbf8f1}
.pend-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:14px;cursor:pointer}
.opt input{width:auto;margin:3px 0 0}
.empty{padding:60px 20px;text-align:center;color:var(--muted);max-width:420px;margin:0 auto}
.start{max-width:460px;margin:60px auto;padding:20px}
.start h1{font:600 26px var(--serif)}
.curr{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0}
.curr.removed span{text-decoration:line-through;color:var(--muted)}
.placebox{position:relative}
.btn.small{padding:5px 10px;font-size:13px;margin-top:4px}
.mapview{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
.map-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-bottom:1px solid #e4ded1;background:var(--bg)}
.map-top h2{font:600 19px/1.2 var(--serif);margin:0}
.map-top .btn{margin-left:auto}
.map-sum{font-size:14px}
.map-body{flex:1;display:flex;min-height:0}
.map-area{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:#dce8ec}
.map-area svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
.map-area svg.drag{cursor:grabbing}
.map-sea{fill:#dce8ec}
.map-land{fill:#f3efe6;stroke:#b8af9c;stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pin{cursor:pointer;outline:none}
.pin circle{fill:var(--accent);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.pin.cluster circle{fill:#24231f}
.pin.sel circle{fill:#b8572e}
.pin:focus-visible circle{stroke:#24231f;stroke-width:3}
.pin-n{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none;font-family:var(--sans)}
.pin-lbl{fill:var(--ink);stroke:#fffdf8;paint-order:stroke;stroke-linejoin:round;font-family:var(--sans)}
.map-credit{position:absolute;left:8px;bottom:6px;right:64px;font-size:11px;line-height:1.3;color:var(--muted);pointer-events:none}
.map-credit::before{content:'';}
.map-list{width:330px;border-left:1px solid #e4ded1;background:#fffdf8;overflow:auto;padding:14px 16px}
.map-h{font:600 15px/1.3 var(--serif);margin:14px 0 6px}
.map-sel{background:#f3efe5;border-radius:10px;padding:12px;margin-bottom:6px}
.map-sel h3{font:600 17px/1.25 var(--serif);margin:0 0 2px}
.map-fix{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.map-fix .btn{padding:5px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.place-row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #f0ebe0;background:none;padding:9px 4px;cursor:pointer;color:var(--ink);font:inherit}
.place-row:hover{background:#f6f2e9}.place-row.sel{background:#e7eee9}
.place-n{color:var(--muted);font-variant-numeric:tabular-nums}
.unplaced{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0ebe0}
.unplaced .btn{padding:5px 10px;font-size:13px}
@media(max-width:799px){.map-body{flex-direction:column}.map-area{flex:1 1 55%}.map-list{width:auto;flex:0 1 45%;border-left:0;border-top:1px solid #e4ded1;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}}
.map-narrow{display:none}
@media(max-width:640px){.map-wide{display:none}.map-narrow{display:inline-block;margin-left:auto;padding:6px 12px}}
</style>
</head>

<script data-ft>
'use strict';
/* Family tree — single-file, no server. Data lives in family.json (or embedded above in an offline copy). */
const W=164,H=60,GX=18,GY=58,PG=26,PAD=50;
const FIELDS=['given','middleName','commonName','surname','birthSurname','sex','born','died','notes'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const REL_TYPES=[['child','is a child of'],['parent','is a parent of'],['partner','is the spouse / partner of'],['expartner','is a former spouse / partner of'],['sibling','is a brother / sister of'],['cousin-m','is a cousin brother of'],['cousin-f','is a cousin sister of']];
const isCousin=t=>t==='cousin-m'||t==='cousin-f';
/* which side a cousin is on: one of the person's aunts/uncles, or a parent's side where that aunt/uncle isn't in the tree yet */
function sideOf(q){const x=P(q)&&P(q).sex;return x==='M'?'Paternal':x==='F'?'Maternal':null;}
function cousinVia(t){
  const T=P(t);if(!T)return[['',"Their parents aren't in the tree yet"]];
  const ps=sortParents(T.parents.filter(P)),opts=[];
  for(const q of ps){
    const sd=sideOf(q),side=sd?`${sd} (${sd==='Paternal'?"father's":"mother's"} side)`:`Through ${dname(P(q))}`,who=sd?(sd==='Paternal'?'father':'mother'):dname(P(q));
    for(const u of siblingsOf(q)){
      if(isPh(u)){const k=childrenOf(u).map(x=>dname(P(x)));if(k.length)opts.push(['p:'+u,`${side}: same parent as ${k.join(', ')}`]);}
      else opts.push(['p:'+u,`${side}: child of ${dname(P(u))}, ${who}'s ${P(u).sex==='F'?'sister':P(u).sex==='M'?'brother':'sibling'}`]);
    }
    opts.push(['q:'+q,`${side}: their parent isn't in the tree yet`]);
  }
  if(ps.length<2){
    if(!ps.some(q=>P(q).sex==='M'))opts.push(['side:M',"Paternal (father's side): their parent isn't in the tree yet"]);
    if(!ps.some(q=>P(q).sex==='F'))opts.push(['side:F',"Maternal (mother's side): their parent isn't in the tree yet"]);
  }
  return opts.sort((a,b)=>a[1].startsWith('Maternal')-b[1].startsWith('Maternal'));
}
function viaText(r){
  if(!r||!isCousin(r.type)||!r.via)return'';
  if(r.via==='side:M')return' (paternal)';if(r.via==='side:F')return' (maternal)';
  const id=r.via.slice(2);if(!P(id))return'';
  if(r.via[0]==='q'){const sd=sideOf(id);return sd?` (${sd.toLowerCase()})`:` (${dname(P(id))}'s side)`;}
  const T=P(r.target),q=T&&T.parents.find(x=>P(x)&&siblingsOf(x).includes(id)),sd=q&&sideOf(q);

function cousinsOf(id){
  const out=new Map();
  for(const q of sortParents(P(id).parents.filter(P))){
    const label=sideOf(q)?sideOf(q)+' cousins':`Cousins through ${dname(P(q))}`;if(!out.has(label))out.set(label,new Set());
    for(const u of siblingsOf(q))for(const c of childrenOf(u))if(c!==id)out.get(label).add(c);

/* storage keys ignore index.html / trailing-slash differences, so …/family-tree/ and …/family-tree/index.html share the same saved token and drafts */

/* ---------- tiny DOM helper ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){

function ghError(r){
  if(r.status===401)return'GitHub rejected the access token (expired or mistyped). Enter it again.';
  if(r.status===403||r.status===404)return"This token can't write to the repository. Check it has Contents: Read and write on this repository, and that you're a collaborator.";
  return'GitHub returned an error ('+r.status+'). Try again in a minute.';
}
async function ghFetchLatest(){
  const c=ghConf(),u=`/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${encodeURIComponent(c.branch)}`;
  const r=await gh('GET',u);
  if(r.status===404&&getTok())return{sha:null,data:emptyData()};
  if(!r.ok)throw new Error(ghError(r));
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64utf8(j.content);
  else{const r2=await gh('GET',u,null,'application/vnd.github.raw+json');if(!r2.ok)throw new Error(ghError(r2));text=await r2.text();}
  return{sha:j.sha,data:normalize(JSON.parse(text))};
}
function merge3(base,ours,theirs){
  const out=clone(theirs),notes=[];const same=(a,b)=>canon(a)===canon(b);
  const nm=p=>p?fullName(p):'someone';
  for(const k of ['title','home','custodians','vault','github','relay']){
    if(same(ours[k],base[k]))continue;
    if(same(theirs[k],base[k])||same(theirs[k],ours[k]))out[k]=clone(ours[k]);
    else notes.push(`Setting "${k}": another custodian also changed it, so their version was kept.`);
  }
  out.imported=[...new Set([...(theirs.imported||[]),...(ours.imported||[])])].slice(-2000);
  const ids=new Set([...Object.keys(base.people),...Object.keys(ours.people),...Object.keys(theirs.people)]);
  for(const id of ids){
    const b=base.people[id],o=ours.people[id],t=theirs.people[id];
    if(same(o,b))continue;                       // untouched by us: their version stands
    if(!b){out.people[id]=clone(o);continue;}     // added by us
    if(!o){                                      // deleted by us
      if(t&&same(t,b))delete out.people[id];
      else if(t)notes.push(`${nm(t)}: you deleted them, but another custodian edited them meanwhile, so they were kept.`);
      continue;
    }
    if(!t){notes.push(`${nm(o)}: another custodian deleted them while you were editing. Re-add them if that was a mistake.`);continue;}
    const r=clone(t);
    for(const k of new Set([...Object.keys(b),...Object.keys(o),...Object.keys(t)])){
      if(same(o[k],b[k]))continue;
      if(same(t[k],b[k])||same(t[k],o[k])){if(o[k]===undefined)delete r[k];else r[k]=clone(o[k]);}
      else notes.push(`${nm(o)}: "${k}" was also changed by another custodian, so their version was kept.`);
    }
    out.people[id]=r;
  }
  return{out:normalize(out),notes};
}

    }},

    m.set([h('p',{text:`Publishing saves your changes straight into ${c.owner}/${c.repo} on GitHub.`}),
      h('div',{class:'warn',style:'margin:0 0 12px'},h('b',{text:'Already have a token? '}),'Paste the same one: a token works in every browser and on every device until you revoke it. It\'s asked for again only where this browser hasn\'t saved it (another browser, a private window, cleared browsing data). Lost it? Open it on GitHub and use "Regenerate token".'),
      h('details',{},h('summary',{style:'cursor:pointer;margin-bottom:8px',text:'First time? How to create a token'}),
        h('ol',{style:'padding-left:20px;margin:0 0 12px'},
          h('li',{},'Sign in to GitHub, then open ',h('a',{href:'https://github.com/settings/personal-access-tokens/new',target:'_blank',rel:'noopener',text:'Settings → Fine-grained tokens → Generate new token'}),'.'),
          h('li',{text:`Repository access: "Only select repositories" → ${c.repo}.`}),
          h('li',{text:'Permissions → Repository permissions → Contents: "Read and write". Nothing else is needed.'}),
          h('li',{text:'Generate it, copy the token, and paste it below. Also keep a copy in your password manager; GitHub shows it only once.'}))),
      form],
      [btn('Cancel',()=>m.close()),h('button',{type:'submit',form:fid,class:'btn primary',text:'Connect'})]);
    if(!getTok())setTimeout(()=>inp.focus(),50);

async function publish(opts={}){
  if(!pubKind()){saveJson();return false;}
  if(pubKind()==='relay'&&!getPass()&&!await askPassword())return false;
  if(pubKind()==='github'&&!getTok()&&!await askToken())return false;
  const kind=pubKind();
  const by=RELAY_WHO||(()=>{try{return localStorage.getItem('ft-by')||'';}catch(e){return'';}})();
  const pb=$('#publish-btn');if(pb){pb.disabled=true;pb.textContent='Publishing…';}
  try{
    for(let attempt=0;attempt<4;attempt++){
      const latest=await latestFrom(kind);
      let next=DATA,notes=[];
      if(latest.sha&&(!BASE||canon(latest.data.people)!==canon(BASE.people)||canon(Object.assign({},latest.data,{people:0,updated:0}))!==canon(Object.assign({},BASE,{people:0,updated:0})))){
        ({out:next,notes}=merge3(BASE||emptyData(),DATA,latest.data));
      }
      next.updated=new Date().toISOString();
      const res=await putTo(kind,JSON.stringify(next,null,1),latest.sha,`Family tree update${by?' by '+by:''}`);
      if(res==='conflict')continue; // someone published between our read and write: re-read and merge again
      DATA=next;BASE=clone(next);rebuildIndex();dirty=false;loadedStamp=DATA.updated;
      try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
      updateStatus();setFocus(P(S.focus)?S.focus:pickHome());
      if(notes.length){const m=modal('Published, with notes',{wide:true});m.set([h('p',{text:'Another custodian published changes while you were working. Both sets of changes were combined, except:'}),h('div',{class:'warn'},notes.map(n=>h('div',{text:n})))],[btn('OK',()=>m.close(),'primary')]);}
      else if(!opts.quiet)toast('Published. Everyone sees it within a few minutes.',5000);
      return true;
    }
    throw new Error('The tree kept changing while publishing. Try again.');
  }catch(e){
    const msg=e instanceof TypeError?(kind==='relay'?RELAY_DOWN:"Can't reach GitHub right now."):e.message;
    const m=modal("Couldn't publish");m.set(h('p',{text:msg+' Your changes are still saved on this device.'}),[btn('OK',()=>m.close(),'primary')]);
    updateStatus();return false;
  }
  finally{const pb=$('#publish-btn');if(pb){pb.disabled=false;pb.textContent='Publish';}}
}
async function refreshLatest(){
  const k=pubKind();if(!k||dirty)return;
  if(k==='relay'&&!getPass())return;if(k==='github'&&!getTok())return;
  try{const latest=await latestFrom(k);
    if(!dirty&&canon(latest.data)!==canon(BASE)){DATA=latest.data;BASE=clone(DATA);rebuildIndex();loadedStamp=DATA.updated;setFocus(P(S.focus)?S.focus:pickHome());toast('Loaded the latest version of the tree.');}
  }catch(e){}
}

/* merge one person into another: used to fill in an "Unknown parent" or to fix a duplicate */
function mergeInto(src,dst){
  const S_=P(src),D=P(dst);if(!S_||!D||src===dst)return false;
  for(const c of childrenOf(src)){const C=P(c);C.parents=[...new Set(C.parents.map(x=>x===src?dst:x))].filter(x=>x!==c).slice(0,2);}
  for(const q of S_.parents)if(D.parents.length<2&&!D.parents.includes(q)&&q!==dst)D.parents.push(q);
  for(const q of S_.partners)if(q!==dst&&P(q)){isEx(src,q)?setEx(dst,q,true):linkPartners(dst,q);}
  if(!S_.placeholder){for(const k of FIELDS)if(!D[k]&&S_[k])D[k]=S_[k];if(D.status==='unknown'&&S_.status!=='unknown'){D.status=S_.status;D.deceased=S_.deceased;}if(!D.priv&&S_.priv){D.priv=S_.priv;if(PRIV[src])PRIV[dst]=PRIV[src];}}
  if(DATA.home===src)DATA.home=dst;
  purge(src);rebuildIndex();return true;
}
const isPh=id=>{const p=P(id);return!!(p&&p.placeholder&&!p.given);};

  const p=P(id),ph=isPh(id);

  m.set([h('p',{text:ph?`Pick the real person this placeholder stands for. Everyone linked to "Unknown parent" (${childrenOf(id).map(c=>dname(P(c))).join(', ')}) will be linked to them instead.`:`Use this when the same person was added twice. ${fullName(p)} will be removed and all their relationships moved to the person you pick. Details only fill in blanks; nothing already there is overwritten.`}),pk.el],

/* custodian hint: someone with one parent whose parent has a partner/co-parent — offer to link them */
function missingParentBox(id){
  const p=P(id);if(!custodian||!p||p.parents.length!==1)return null;
  const par=p.parents[0],cands=partnersOf(par).filter(q=>q!==id&&!isAncestorOf(id,q)&&!isEx(par,q));
  if(!cands.length)return null;
  const box=h('div',{class:'warn',style:'margin-top:14px'},h('div',{style:'font-weight:600;margin-bottom:4px',text:'Missing a parent?'}),
    h('div',{style:'font-size:13px;margin-bottom:8px',text:`${dname(p)} is linked to only one parent, ${dname(P(par))}.`}));
  for(const q of cands){
    const sibs=childrenOf(par).filter(c=>P(c).parents.length<2&&!isAncestorOf(c,q));
    const link=ids=>{const w=[];ids.forEach(c=>addParent(c,q,w));rebuildIndex();markDirty();setFocus(id);toast(w.length?w.join(' '):`Linked ${dname(P(q))} as parent.`,5000);};
    box.append(h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin-top:4px'},
      btn(`${dname(P(q))} is also ${dname(p)}'s parent`,()=>link([id]),'primary'),
      sibs.length>1?btn(`…and of all: ${sibs.map(c=>dname(P(c))).join(', ')}`,()=>link(sibs)):null));
  }
  return box;
}

/* ---------- relay: relatives' additions go to a private queue; custodians sign in with a password (no GitHub needed) ---------- */
const PASS_KEY='ft-relay-pass:'+location.host+PAGE_PATH;
const getPass=()=>{try{return localStorage.getItem(PASS_KEY)||'';}catch(e){return'';}};
const setPass=v=>{try{v?localStorage.setItem(PASS_KEY,v):localStorage.removeItem(PASS_KEY);}catch(e){}};
const relayURL=()=>String(DATA&&DATA.relay||'').trim().replace(/\/+$/,'');
const relayOn=()=>/^https?:\/\/[^\s]+$/.test(relayURL());
const viaRelay=()=>relayOn()&&S.pubMode!=='github';
let RELAY_WHO='';
async function relayFetch(path,{method='GET',body,auth=true}={}){
  return fetch(relayURL()+path,{method,cache:'no-store',
    headers:Object.assign({},body!==undefined?{'Content-Type':'application/json'}:{},auth?{Authorization:'Bearer '+getPass()}:{}),
    body:body!==undefined?JSON.stringify(body):undefined});
}
async function relayErr(r){try{const j=await r.json();return j.error||('The relay answered '+r.status+'.');}catch(e){return'The relay answered '+r.status+'.';}}
const RELAY_DOWN="Can't reach the family tree's relay right now. Check your internet connection and try again.";
/* true = signed in, false = password refused, null = relay unreachable */
async function relayWhoami(){
  if(!getPass())return false;
  try{const r=await relayFetch('/whoami');
    if(r.ok){RELAY_WHO=(await r.json()).name||'';return true;}
    if(r.status===401){setPass('');return false;}
    return null;
  }catch(e){return null;}
}
function askPassword(){
  return new Promise(res=>{
    const fid='passform'+Date.now();
    const user=h('input',{type:'text',name:'username',autocomplete:'username',value:'Family tree custodian',readonly:true,style:'color:var(--muted)'});
    const inp=h('input',{type:'password',name:'password',autocomplete:'current-password'});
    const err=h('div',{class:'err',hidden:true});
    let done=false;const finish=v=>{if(!done){done=true;res(v);}};
    const m=modal('Custodian sign-in',{onclose:()=>finish(!!RELAY_WHO&&!!getPass())});
    const form=h('form',{id:fid,action:'#',onsubmit:async e=>{
      e.preventDefault();const pw=inp.value;if(!pw){inp.focus();return;}
      err.hidden=true;setPass(pw);
      try{const r=await relayFetch('/whoami');
        if(r.ok){RELAY_WHO=(await r.json()).name||'';m.close();toast('Signed in as '+(RELAY_WHO||'custodian')+'.');return;}
        setPass('');err.textContent=r.status===401?'That password was not accepted.':await relayErr(r);err.hidden=false;
      }catch(x){setPass('');err.textContent=RELAY_DOWN;err.hidden=false;}
    }},
      h('label',{class:'field',hidden:true},user),
      h('label',{class:'field'},h('span',{class:'lbl',text:'Your custodian password'}),inp,
        h('span',{class:'hint',text:'Each custodian has their own password from the family\'s steward. If your browser or password manager offers to save it, say yes.'})),err);
    const alt=ghConf()?btn('Use a GitHub token instead',()=>{S.pubMode='github';done=true;m.close();res(true);}):null;
    m.set([form,ghConf()?h('p',{class:'hint',text:'If the relay is down, a custodian with a GitHub token can still publish.'}):null],
      [alt,btn('Cancel',()=>m.close()),h('button',{type:'submit',form:fid,class:'btn primary',text:'Sign in'})]);
    setTimeout(()=>inp.focus(),50);

/* ---- relatives: send additions to the queue ---- */
async function relaySubmit(sub){
  try{const r=await relayFetch('/submit',{method:'POST',body:sub,auth:false});return r.ok?{ok:true}:{ok:false,err:await relayErr(r)};}
  catch(e){return{ok:false,err:RELAY_DOWN};}
}
/* ---- custodians: the queue ---- */
S.pending=null;
async function loadPending(){
  const items=[];let cursor=null,guard=0;
  do{const r=await relayFetch('/pending'+(cursor?'?cursor='+encodeURIComponent(cursor):''));
    if(r.status===401){setPass('');RELAY_WHO='';throw new Error('Your custodian password was not accepted. Sign in again.');}
    if(!r.ok)throw new Error(await relayErr(r));
    const j=await r.json();items.push(...(j.items||[]));cursor=j.cursor;
  }while(cursor&&++guard<50);
  const clean=items.filter(s=>s&&Array.isArray(s.people)&&typeof s.sid==='string').map(s=>Object.assign(s,{people:s.people.filter(p=>p&&/^n\d+$/.test(p.tmp))}));
  clean.sort((a,b)=>String(a.receivedAt||'').localeCompare(String(b.receivedAt||'')));
  S.pending=clean;updatePendingBtn();return clean;
}
function updatePendingBtn(){
  const b=$('#pending-btn');if(!b)return;
  b.hidden=!(custodian&&viaRelay());
  const n=S.pending?S.pending.filter(s=>!DATA.imported.includes(s.sid)).length:null;
  b.textContent=n===null?'Pending':`Pending (${n})`;b.classList.toggle('primary',!!n);
}
async function refreshPending(){try{await loadPending();}catch(e){}}
async function openPending(){
  if(!getPass()&&!await askPassword())return;
  const m=modal('Pending additions',{wide:true,sticky:true});
  m.set(h('p',{class:'muted',text:'Loading…'}),[btn('Close',()=>m.close())]);
  let items;
  try{items=await loadPending();}catch(e){m.set(h('p',{class:'err',text:e instanceof TypeError?RELAY_DOWN:e.message}),[btn('Close',()=>m.close())]);return;}
  const render=()=>{
    S.pending=items;updatePendingBtn();
    if(!items.length){m.set(h('p',{text:'Nothing is waiting for approval.'}),[btn('Close',()=>m.close(),'primary')]);return;}
    const blocks=items.map(s=>{
      const choices={},done=DATA.imported.includes(s.sid);
      const acts=done?[h('span',{class:'muted',text:'Already in the tree.'}),btn('Remove from list',()=>drop(s))]
        :[btn('Reject',()=>reject(s),'danger'),btn('Approve',e=>approve(s,choices,e.target),'primary')];
      return h('div',{class:'pend'},subReview(s,choices),h('div',{class:'pend-actions'},acts));
    });
    m.set([h('p',{class:'muted',text:'For each one, check who it is and, if someone may already be in the tree, choose what to do. Approve adds them and publishes the tree; Reject deletes the submission.'}),...blocks],[btn('Close',()=>m.close())]);
  };
  const drop=async s=>{try{const r=await relayFetch('/pending/'+encodeURIComponent(s.sid),{method:'DELETE'});if(!r.ok){toast(await relayErr(r));return;}}catch(e){toast(RELAY_DOWN);return;}items=items.filter(x=>x!==s);render();};
  const reject=async s=>{if(!await confirmBox(`Reject the addition from ${s.by||'someone'}? It will be deleted and nothing is added to the tree.`,'Reject',true))return;drop(s);};
  const approve=async(s,choices,b)=>{
    if(b){b.disabled=true;b.textContent='Approving…';}
    const res=await applySubs([s],choices);
    if(!res){if(b){b.disabled=false;b.textContent='Approve';}return;}
    const ok=await publish({quiet:true});
    if(ok){try{await relayFetch('/pending/'+encodeURIComponent(s.sid),{method:'DELETE'});}catch(e){}items=items.filter(x=>x!==s);
      toast(`Approved: ${res.added} ${res.added===1?'person':'people'} added and published.`,5000);}
    else toast('Added on this device but not published yet, so it stays in the list. Tap Publish once the problem is fixed.',7000);
    render();
    if(res.warns.length){const w=modal('Approved, with notes',{wide:true});w.set(h('div',{class:'warn'},res.warns.map(x=>h('div',{text:x}))),[btn('OK',()=>w.close(),'primary')]);}
  };
  render();
}
/* ---- publishing through the relay or straight to GitHub ---- */
function pubKind(){if(viaRelay())return'relay';if(ghConf())return'github';return null;}
async function latestFrom(kind){
  if(kind==='relay'){
    const r=await relayFetch('/file');
    if(r.status===401){setPass('');RELAY_WHO='';throw new Error('Your custodian password was not accepted. Sign in again.');}
    if(!r.ok)throw new Error(await relayErr(r));
    const j=await r.json(),text=typeof j.text==='string'?j.text:(j.base64?b64utf8(j.base64):null);
    return{sha:j.sha||null,data:text?normalize(JSON.parse(text)):emptyData()};
  }
  return ghFetchLatest();
}
async function putTo(kind,text,sha,msg){
  if(kind==='relay'){
    const r=await relayFetch('/file',{method:'POST',body:{base64:utf8b64(text),sha}});
    if(r.status===409)return'conflict';
    if(r.status===401){setPass('');RELAY_WHO='';throw new Error('Your custodian password was not accepted. Sign in again.');}
    if(!r.ok)throw new Error(await relayErr(r));
    return'ok';
  }
  const c=ghConf();
  const r=await gh('PUT',`/repos/${c.owner}/${c.repo}/contents/${c.path}`,{message:msg,content:utf8b64(text),branch:c.branch,...(sha?{sha}:{})});
  if(r.status===409||r.status===422)return'conflict';
  if(r.status===401){setTok('');throw new Error(ghError(r));}
  if(!r.ok)throw new Error(ghError(r));
  return'ok';
}

/* ---------- encoding for submission codes ---------- */
function b64e(str){const b=new TextEncoder().encode(str);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);}

/* ---------- modal / dialogs ---------- */
function modal(title,opts={}){
  const body=h('div',{class:'modal-body'}),foot=h('div',{class:'modal-foot'});
  const box=h('div',{class:'modal'+(opts.wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':title},
    h('div',{class:'modal-head'},h('h2',{text:title}),h('button',{type:'button',class:'icon-btn','aria-label':'Close',text:'✕',onclick:()=>close()})),body,foot);
  const ov=h('div',{class:'overlay',onclick:e=>{if(e.target===ov&&!opts.sticky)close();}},box);
  $('#modal-root').append(ov);
  function close(){ov.remove();opts.onclose&&opts.onclose();}
  const set=(b,f)=>{body.innerHTML='';foot.innerHTML='';body.append(...[b].flat(9).filter(x=>x!=null&&x!==false));if(f)foot.append(...f.filter(Boolean));box.scrollIntoView({block:'start'});};
  return{close,set,body,foot};
}

}
function choose(msg,opts){

    m.set([h('p',{text:msg}),...opts.map(([v,t],i)=>h('button',{type:'button',class:'btn'+(i===0?' primary':''),style:'display:block;width:100%;margin-bottom:8px;white-space:normal;text-align:left',text:t,onclick:()=>{res(v);m.close();}}))]);});

/* put reviewed submissions into the tree; null if a needed passphrase wasn't given */
async function applySubs(subs,choices){

  if(needs&&!await ensureKey()){toast('Some people include contact details, which need the family passphrase. Set or enter it, then try again.',6000);return null;}
  const warns=[];let added=0,first=null;
  for(const s of subs){
    const map={},pend=[];
    s.people.forEach(p=>{const c=choices[s.sid+'|'+p.tmp];if(c==='skip')return;
      if(c==='new'||!P(c)){map[p.tmp]=createPerson(p);added++;if(hasPriv(p.priv))pend.push([map[p.tmp],cleanPriv(p.priv)]);}
      else{const e=P(c),f=cleanFields(p);for(const k of FIELDS)if(!e[k]&&f[k])e[k]=f[k];if(f.status&&f.status!=='unknown'&&e.status==='unknown'){e.status=f.status;e.deceased=f.status==='deceased';}map[p.tmp]=c;if(hasPriv(p.priv)){const o=Object.assign({},PRIV[c]||{}),nn=cleanPriv(p.priv);for(const k in nn)if(!o[k]&&nn[k])o[k]=nn[k];pend.push([c,o]);}}

    for(const [pid,o] of pend)await setPriv(pid,o);
