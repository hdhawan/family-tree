<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<style data-ft>
:root{--bg:#f6f3ec;--ink:#24231f;--muted:#6b675e;--line:#b3ab9b;--card:#fffdf8;--edge:#ddd5c4;--accent:#2f5d50;--m:#4a6fa5;--f:#b35a7a;--u:#b9b4a8;--alive:#3b8f57;--dead:#b8453a;--danger:#a33a2b;--serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid #d6cfbf;border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid #e4ded1}
.top h1{font:600 20px/1.2 var(--serif);margin:0;flex:0 1 auto}
.top-actions{display:flex;gap:8px;margin-left:auto}
.search{position:relative;flex:1 1 200px;max-width:360px}
@media(max-width:640px){.search{order:3;flex-basis:100%;max-width:none}}
.btn{border:1px solid #cfc7b6;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b5ac98}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#e0b8b0}
.btn.on{background:#e3ece5;border-color:var(--accent);color:var(--accent)}
.icon-btn{border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
.cust-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;background:#e6eee8;border-bottom:1px solid #d3dfd5}
.cust-bar .btn{padding:6px 10px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.status.dirty{color:var(--danger);font-weight:600}
.banner{background:#fff3cd;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.body{flex:1;display:flex;min-height:0;position:relative}
.tree-area{flex:1;position:relative;display:flex;min-height:0;min-width:0}
.tree-wrap{flex:1;overflow:auto;position:relative;cursor:grab;touch-action:pan-x pan-y}
.tree-wrap.dragging{cursor:grabbing}
.canvas{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lines line{stroke:var(--line);stroke-width:1.5}
.lines line.ex{stroke-dasharray:4 3;stroke-width:2.5;stroke:#7d7666}
.card{position:absolute;background:var(--card);border:2.5px solid var(--u);border-radius:8px;padding:6px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:center;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.st-living{border-color:var(--alive)}
.card.st-deceased{border-color:var(--dead)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--u);vertical-align:-1px;margin:0 4px 0 10px}
.dot.st-living{border-color:var(--alive)}.dot.st-deceased{border-color:var(--dead)}
.card .nm{font:600 14px/1.2 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .yr{font-size:11.5px;line-height:1.25;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.has-cn .nm{-webkit-line-clamp:1}
.card.focus{background:#fff6dc;outline:2px solid #24231f;outline-offset:3px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.card.ph{border-style:dashed;background:transparent}
.card.ph .nm{color:var(--muted);font-style:italic}
.tg{position:absolute;left:50%;transform:translateX(-50%);min-width:32px;height:22px;border-radius:11px;border:1px solid #cfc7b6;background:#fff;font:600 12px/20px var(--sans);color:var(--accent);cursor:pointer;padding:0 8px;z-index:2}
.tg:hover{background:#e6eee8}
.tg-down{bottom:-12px}
.tg-up{top:-12px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:40px;height:40px;border-radius:20px;border:1px solid #cfc7b6;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(246,243,236,.92);padding:6px 10px;border-radius:8px;z-index:4;pointer-events:none}
.side{background:#fffdf8;overflow:auto}
@media(min-width:800px){.side{width:340px;border-left:1px solid #e4ded1;padding:18px}.side.closed{display:none}}
.show-side{position:absolute;top:12px;right:12px;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media(max-width:799px){.show-side{display:none!important}}
.side-toggle{white-space:nowrap;font-size:14px}
@media(max-width:799px){
 .body{flex-direction:column}
 .side{border-top:1px solid #e4ded1;padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-height:58vh;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
 .side.collapsed .side-more{display:none}
 .legend{display:none}
 .zoom{bottom:12px}
}
.side-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.side h3{font:600 21px/1.2 var(--serif);margin:0}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;white-space:pre-wrap}
.rel h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d6cfbf;background:#fff;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip-yr{color:var(--muted);margin-left:6px;font-size:12px}
.chip.small{font-size:12px;padding:3px 9px;margin-top:6px;color:var(--accent)}
.side-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 10px}
.modal{background:#fffdf8;border-radius:14px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:640px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.modal-head h2{font:600 19px/1.25 var(--serif);margin:0}
.modal-body{padding:12px 16px}
.modal-body p{margin:0 0 10px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:0 16px 16px}
.modal-foot:empty{display:none}
.field{display:block;margin-bottom:10px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.hint{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.row3{grid-template-columns:1fr}}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.radios{display:flex;gap:18px;margin:2px 0 10px}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}
.radios input{width:auto;margin:0}
.relsec{border-top:1px solid #e7e1d4;margin-top:8px;padding-top:10px}
.relsec>.lbl{margin-bottom:8px}
.relrow{background:#f3efe5;border-radius:8px;padding:8px;margin-bottom:8px}
.relrow-top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.relrow-top .muted{white-space:nowrap;font-size:13px}
.picker{position:relative}
.pk-list{position:absolute;left:0;right:0;top:100%;z-index:6;background:#fff;border:1px solid #d6cfbf;border-radius:8px;margin-top:2px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.pk-item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid #f0ebe0;background:#fff;padding:9px 10px;cursor:pointer;color:var(--ink)}
.pk-item:hover,.pk-item:focus{background:#f3efe5}
.pk-empty{padding:9px 10px;color:var(--muted);font-size:13px}
.pk-pill{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#fff;border:1px solid var(--accent);border-radius:8px;padding:5px 4px 5px 10px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.warn{background:#fff3cd;border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#24231f;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.box{border:1px solid #e4ded1;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.box h4{margin:0 0 2px;font:600 15px var(--serif)}
.opt{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:14px;cursor:pointer}
.opt input{width:auto;margin:3px 0 0}
.empty{padding:60px 20px;text-align:center;color:var(--muted);max-width:420px;margin:0 auto}
.start{max-width:460px;margin:60px auto;padding:20px}
.start h1{font:600 26px var(--serif)}
.curr{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0}
.curr.removed span{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="embedded-data" data-ft></script>
<script data-ft>
'use strict';
/* Family tree — single-file, no server. Data lives in family.json (or embedded above in an offline copy). */
const W=164,H=60,GX=18,GY=58,PG=26,PAD=50;
const FIELDS=['given','middleName','commonName','surname','birthSurname','sex','born','died','notes'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REL_TYPES=[['child','is a child of'],['parent','is a parent of'],['partner','is the spouse / partner of'],['expartner','is a former spouse / partner of'],['sibling','is a brother / sister of']];
const DRAFT_KEY='ft-draft:'+location.pathname;
let DATA=null,KIDS={},custodian=false,dirty=false,loadedStamp=null;
const S={focus:null,up:new Set(),down:new Set(),zoom:1};

/* ---------- tiny DOM helper ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return e;
}
const btn=(text,fn,cls)=>h('button',{type:'button',class:'btn'+(cls?' '+cls:''),onclick:fn,text});
function toast(msg,ms=3200){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);}

/* ---------- data helpers ---------- */
const P=id=>DATA&&id?DATA.people[id]:null;
function emptyData(){return{format:'family-tree/1',title:'Our Family Tree',updated:null,home:null,custodians:[],imported:[],people:{}};}
function normalize(d){
  const o=Object.assign(emptyData(),d||{});
  if(!o.people||typeof o.people!=='object')o.people={};
  for(const [id,p] of Object.entries(o.people)){
    if(!p||typeof p!=='object'){delete o.people[id];continue;}
    p.id=id;
    for(const k of FIELDS)p[k]=typeof p[k]==='string'?p[k]:'';
    p.status=['living','deceased','unknown'].includes(p.status)?p.status:(p.deceased?'deceased':'living');
    p.deceased=p.status==='deceased';p.placeholder=!!p.placeholder;
  }
  for(const p of Object.values(o.people)){
    p.parents=[...new Set(Array.isArray(p.parents)?p.parents.filter(x=>o.people[x]&&x!==p.id):[])].slice(0,2);
    p.partners=[...new Set(Array.isArray(p.partners)?p.partners.filter(x=>o.people[x]&&x!==p.id):[])];
  }
  for(const p of Object.values(o.people))for(const q of p.partners)if(!o.people[q].partners.includes(p.id))o.people[q].partners.push(p.id);
  for(const p of Object.values(o.people))p.ex=[...new Set(Array.isArray(p.ex)?p.ex.filter(x=>p.partners.includes(x)):[])];
  for(const p of Object.values(o.people))for(const q of p.ex)if(!o.people[q].ex.includes(p.id))o.people[q].ex.push(p.id);
  if(!Array.isArray(o.custodians))o.custodians=[];
  if(!Array.isArray(o.imported))o.imported=[];
  if(!o.vault||typeof o.vault.salt!=='string'||typeof o.vault.check!=='string')delete o.vault;
  for(const p of Object.values(o.people))if(typeof p.priv!=='string')delete p.priv;
  if(typeof o.title!=='string'||!o.title.trim())o.title='Our Family Tree';
  return o;
}
function rebuildIndex(){KIDS={};for(const p of Object.values(DATA.people))for(const q of p.parents)(KIDS[q]=KIDS[q]||[]).push(p.id);}
const childrenOf=id=>KIDS[id]||[];
function partnersOf(id){
  const p=P(id);if(!p)return[];
  const set=new Set(p.partners.filter(P));
  for(const c of childrenOf(id))for(const q of P(c).parents)if(q!==id)set.add(q);
  return [...set].sort((a,b)=>isEx(id,a)-isEx(id,b));
}
function siblingsOf(id){
  const p=P(id);const s=new Set();
  for(const q of p.parents)for(const c of childrenOf(q))if(c!==id)s.add(c);
  return sortByBirth([...s]);
}
function year(d){const m=/(\d{4})/.exec(d||'');return m?+m[1]:null;}
function stat(p){if(!p||p.placeholder)return'unknown';const b=year(p.born);if(p.status!=='deceased'&&b&&new Date().getFullYear()-b>110)return'deceased';return p.status||'unknown';}
/* 'unknown' is treated like living for privacy (birth year only) */
function isLiving(p){return stat(p)!=='deceased';}
const STATUS_LABEL={living:'Living',deceased:'Deceased',unknown:'Not known'};
/* dname: what the family calls them (common name + surname); fullName: legal name with common name in quotes */
function dname(p){if(!p)return'Unknown';if(p.commonName&&!p.placeholder)return p.commonName;return name(p);}
function fullName(p){if(!p)return'Unknown';if(p.placeholder&&!p.given)return name(p);return[p.given,p.middleName,p.commonName?'“'+p.commonName+'”':'',p.surname].filter(Boolean).join(' ');}
function name(p){if(!p)return'Unknown';if(p.placeholder&&!p.given)return'Unknown parent';return[p.given,p.surname].filter(Boolean).join(' ')||'Unnamed';}
function fmtDate(d,living){
  if(!d)return'';const ap=d[0]==='~';const [y,m,dd]=(ap?d.slice(1):d).split('-');
  let out;if(living&&!custodian)out=y;else if(dd)out=`${+dd} ${MON[+m-1]} ${y}`;else if(m)out=`${MON[+m-1]} ${y}`;else out=y;
  return(ap?'c. ':'')+out;
}
function lifespan(p){
  if(!p||p.placeholder)return'';
  const b=year(p.born),d=year(p.died),ap=p.born&&p.born[0]==='~'?'c. ':'';
  if(isLiving(p))return b?`b. ${ap}${b}`:'';
  if(!b&&!d)return'Deceased';
  return`${b?ap+b:'?'} – ${d||'?'}`;
}
function sortByBirth(ids){return ids.slice().sort((a,b)=>(year(P(a).born)||9999)-(year(P(b).born)||9999)||name(P(a)).localeCompare(name(P(b))));}
function sortParents(ids){return ids.slice().sort((a,b)=>(P(a).sex==='F')-(P(b).sex==='F'));}
function rid(pre){let id;do{id=pre+Math.random().toString(36).slice(2,10);}while(DATA.people[id]);return id;}
function pickHome(){if(P(DATA.home))return DATA.home;const ids=Object.keys(DATA.people);return ids.length?sortByBirth(ids)[ids.length-1>0?Math.floor(ids.length/2):0]:null;}
function parseDate(raw){
  let s=(raw||'').trim();if(!s)return{ok:true,value:''};
  let ap=false;const am=/^(~|c\.|ca\.?|circa|abt\.?|about|approx\.?|c(?=\s))\s*/i.exec(s);
  if(am){ap=true;s=s.slice(am[0].length).trim();}
  s=s.replace(/(\d)(st|nd|rd|th)\b/gi,'$1').replace(/,/g,' ').replace(/\s+/g,' ').trim();
  const mon=t=>{const i=MON.map(x=>x.toLowerCase()).indexOf(t.slice(0,3).toLowerCase());return i<0?null:i+1;};
  const SEP='[-/. ]';let y,m,d,x;
  if(x=/^(\d{4})$/.exec(s))y=+x[1];
  else if(x=new RegExp(`^(\\d{4})${SEP}(\\d{1,2})$`).exec(s)){y=+x[1];m=+x[2];}
  else if(x=new RegExp(`^(\\d{4})${SEP}(\\d{1,2})${SEP}(\\d{1,2})$`).exec(s)){y=+x[1];m=+x[2];d=+x[3];}
  else if(x=new RegExp(`^(\\d{1,2})${SEP}(\\d{4})$`).exec(s)){m=+x[1];y=+x[2];}
  else if(x=new RegExp(`^(\\d{1,2})${SEP}(\\d{1,2})${SEP}(\\d{4})$`).exec(s)){
    const a=+x[1],b=+x[2];y=+x[3];
    if(a>12&&b<=12){d=a;m=b;}else if(b>12&&a<=12){m=a;d=b;}else if(a===b){d=a;m=b;}
    else if(a<=12&&b<=12)return{ok:false,why:`"${raw.trim()}" could be ${a} ${MON[b-1]} or ${b} ${MON[a-1]}. Write the month as a word, e.g. ${a} ${MON[b-1]} ${y}.`};
    else return{ok:false};
  }
  else if(x=new RegExp(`^(\\d{1,2})${SEP}([A-Za-z]+)\\.?${SEP}(\\d{4})$`).exec(s)){d=+x[1];m=mon(x[2]);y=+x[3];}
  else if(x=new RegExp(`^([A-Za-z]+)\\.?${SEP}(\\d{1,2})${SEP}(\\d{4})$`).exec(s)){m=mon(x[1]);d=+x[2];y=+x[3];}
  else if(x=new RegExp(`^([A-Za-z]+)\\.?${SEP}(\\d{4})$`).exec(s)){m=mon(x[1]);y=+x[2];}
  else return{ok:false};
  if(m===null)return{ok:false};
  if(y<1000||y>new Date().getFullYear())return{ok:false,why:'That year looks wrong.'};
  if(m!==undefined&&(m<1||m>12))return{ok:false};
  if(d!==undefined){const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1||dt.getDate()!==d)return{ok:false,why:'That day doesn\'t exist in that month.'};}
  return{ok:true,value:(ap?'~':'')+y+(m?'-'+String(m).padStart(2,'0'):'')+(d?'-'+String(d).padStart(2,'0'):'')};
}
/* live "read as" line under a date box, so people see how their date was understood */
function datePreview(input){
  const out=h('span',{class:'hint'});
  const upd=()=>{const v=input.value.trim();if(!v){out.textContent='';out.style.color='';return;}const r=parseDate(v);
    if(r.ok){out.textContent='✓ Read as '+dateToInput(r.value);out.style.color='var(--alive)';}
    else{out.textContent=r.why||'Not understood. Try 1952, Mar 1952 or 14 Mar 1952.';out.style.color='var(--danger)';}};
  input.addEventListener('input',upd);upd();return out;
}
function dateToInput(v){if(!v)return'';const ap=v[0]==='~';const [y,m,d]=(ap?v.slice(1):v).split('-');return(ap?'c. ':'')+(d?`${+d} ${MON[+m-1]} ${y}`:m?`${MON[+m-1]} ${y}`:y);}
const validDate=v=>typeof v==='string'&&/^~?\d{4}(-\d{2}(-\d{2})?)?$/.test(v);
function isAncestorOf(x,y){const st=[...P(y).parents],seen=new Set();while(st.length){const c=st.pop();if(c===x)return true;if(seen.has(c)||!P(c))continue;seen.add(c);st.push(...P(c).parents);}return false;}
function createPerson(f){
  const id=rid('p');
  DATA.people[id]={id,given:'',surname:'',birthSurname:'',sex:'',born:'',died:'',deceased:false,status:'unknown',notes:'',parents:[],partners:[],ex:[],placeholder:false};
  Object.assign(DATA.people[id],cleanFields(f));
  return id;
}
function cleanFields(f){
  const o={};
  for(const k of FIELDS)if(f[k]!==undefined)o[k]=String(f[k]||'').slice(0,k==='notes'?2000:120).trim();

function merge3(base,ours,theirs){

  for(const k of ['title','home','custodians','vault','github']){
    if(same(ours[k],base[k]))continue;
    if(same(theirs[k],base[k])||same(theirs[k],ours[k]))out[k]=clone(ours[k]);
    else notes.push(`Setting "${k}": another custodian also changed it, so their version was kept.`);
  }
  out.imported=[...new Set([...(theirs.imported||[]),...(ours.imported||[])])].slice(-2000);
  const ids=new Set([...Object.keys(base.people),...Object.keys(ours.people),...Object.keys(theirs.people)]);
  for(const id of ids){
    const b=base.people[id],o=ours.people[id],t=theirs.people[id];

    if(!o){                                      // deleted by us
      if(t&&same(t,b))delete out.people[id];

      continue;
    }

    const r=clone(t);

async function publish(){

  const pb=$('#publish-btn');if(pb){pb.disabled=true;pb.textContent='Publishing…';}

      const latest=await ghFetchLatest();

      if(latest.sha&&(!BASE)||latest.sha&&BASE&&(canon(latest.data.people)!==canon(BASE.people)||canon(Object.assign({},latest.data,{people:0,updated:0}))!==canon(Object.assign({},BASE,{people:0,updated:0})))){

/* merge one person into another: used to fill in an "Unknown parent" or to fix a duplicate */
function mergeInto(src,dst){

  const nodes=[],lines=[];

  const focus=P(S.focus);
  const fParents=sortParents(focus.parents.filter(P));

  // ---- downward: from the focus's parents (so siblings sit beside the focus), else from the focus
  function mDown(id,path,unit,kids){
    unit=unit||[id,...partnersOf(id)];
    const uw=unit.length*W+(unit.length-1)*PG;
    let ks=[];
    const open=kids?true:S.down.has(id);
    if(open&&!path.has(id)){const np=new Set(path);np.add(id);ks=(kids||sortByBirth(childrenOf(id))).map(c=>mDown(c,np));}
    const kw=ks.reduce((a,k)=>a+k.w,0)+Math.max(0,ks.length-1)*GX;
    return{id,unit,uw,kids:ks,w:Math.max(uw,kw),kw,root:!!kids};
  }
  function pDown(n,left,row){
    const ux=left+(n.w-n.uw)/2,y=row*(H+GY);
    n.unit.forEach((pid,i)=>{
      const kc=childrenOf(pid).length;
      nodes.push({id:pid,x:ux+i*(W+PG),y,key:`d${row}:${pid}`,
        down:!n.root&&i===0&&kc?kc:0,
        up:n.root?P(pid).parents.filter(P).length:0});
      if(i>0)lines.push({x1:ux+i*(W+PG)-PG,y1:y+H/2,x2:ux+i*(W+PG),y2:y+H/2,cls:isEx(n.unit[0],pid)?'ex':''});
    });
    n.cx=ux+W/2;
    n.unitCx=n.unit.map((_,i)=>ux+i*(W+PG)+W/2);
    const ax=n.unit.length>1?ux+W+PG/2:ux+W/2;
    if(n.kids.length){
      let kl=left+(n.w-n.kw)/2;const midY=y+H+GY/2,cs=[];
      n.kids.forEach(k=>{pDown(k,kl,row+1);cs.push(k.cx);kl+=k.w+GX;});
      L(ax,y+H,ax,midY);
      L(Math.min(ax,...cs),midY,Math.max(ax,...cs),midY);

  }
  // ---- upward: ancestors above a given person
  function mUp(id,path){
    let par=[];

  function pUp(n,left,row,out){

      L(Math.min(n.cx,...cs),midY,Math.max(n.cx,...cs),midY,out.lines,rt?'hz':null);
      cs.forEach(c=>L(c,midY,c,(row-1)*(H+GY)+H,out.lines));
    }
  }

  if(fParents.length){
    const kids=sortByBirth([...new Set(fParents.flatMap(childrenOf))]);
    const root=mDown(fParents[0],new Set(),fParents,kids);
    pDown(root,0,-1);
    // ancestors of each parent, pushed outward so the two sides never overlap
    const mid=fParents.length>1?(root.unitCx[0]+root.unitCx[1])/2:null;

}

  ids.forEach(id=>{const p=P(id),ps=p.parents.filter(P);if(ps.length)fam(ps[0],ps[1]).kids.push(id);p.partners.filter(P).forEach(q=>{if(id<q)fam(id,q);});});
  const fx=new Map(),famsOf={},famcOf={};let i=0;
  fams.forEach((f,k)=>{const x='@F'+(++i)+'@';fx.set(k,x);[f.a,f.b].filter(Boolean).forEach(s=>(famsOf[s]=famsOf[s]||[]).push(x));f.kids.forEach(c=>(famcOf[c]=famcOf[c]||[]).push(x));});
  const L=['0 HEAD','1 SOUR FAMILYTREEPAGE','2 NAME Family Tree Page','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 DATE '+gdate(new Date().toISOString().slice(0,10))];
  ids.forEach(id=>{const p=P(id),gv=g(p.given)||(p.placeholder?'Unknown':'');
    const gvm=[gv,g(p.middleName)].filter(Boolean).join(' ');
    L.push(`0 ${xi[id]} INDI`,`1 NAME ${gvm} /${g(p.surname)}/`);
    if(p.given)L.push('2 GIVN '+gvm);if(p.commonName)L.push('2 NICK '+g(p.commonName));if(p.surname)L.push('2 SURN '+g(p.surname));
    if(p.birthSurname&&p.birthSurname!==p.surname)L.push(`1 NAME ${gvm} /${g(p.birthSurname)}/`,'2 TYPE birth');
    L.push('1 SEX '+(p.sex==='M'||p.sex==='F'?p.sex:'U'));
    if(p.born)L.push('1 BIRT','2 DATE '+gdate(p.born));
    if(p.died)L.push('1 DEAT','2 DATE '+gdate(p.died));else if(stat(p)==='deceased')L.push('1 DEAT Y');
    if(p.notes){const ls=p.notes.split(/\r?\n/);L.push('1 NOTE '+ls[0].replace(/@/g,'@@'));ls.slice(1).forEach(l=>L.push('2 CONT '+l.replace(/@/g,'@@')));}
    const pr=PRIV[id];if(pr&&hasPriv(pr)){L.push('1 RESI');if(pr.residence)L.push('2 PLAC '+g(pr.residence));if(pr.phone)L.push('2 PHON '+g(pr.phone));if(pr.email)L.push('2 EMAIL '+g(pr.email));}
    (famcOf[id]||[]).forEach(x=>L.push('1 FAMC '+x));(famsOf[id]||[]).forEach(x=>L.push('1 FAMS '+x));});
  fams.forEach((f,k)=>{L.push(`0 ${fx.get(k)} FAM`);let hu=null,wi=null;
    [f.a,f.b].filter(Boolean).forEach(s=>{if(P(s).sex==='F'&&!wi)wi=s;else if(!hu)hu=s;else wi=s;});
    if(hu)L.push('1 HUSB '+xi[hu]);if(wi)L.push('1 WIFE '+xi[wi]);if(f.a&&f.b&&isEx(f.a,f.b))L.push('1 DIV Y');f.kids.forEach(c=>L.push('1 CHIL '+xi[c]));});
  L.push('0 TRLR');return L.join('\r\n')+'\r\n';
}
async function exportGedcom(){if(await saveFile('family-tree.ged',toGedcom(),'text/plain'))toast('GEDCOM exported. Any genealogy program can open it.');}
async function saveOffline(){
  const doc=document.documentElement.cloneNode(true);
  doc.querySelectorAll('script:not([data-ft]),style:not([data-ft]),link,base,iframe').forEach(e=>e.remove());
  doc.querySelector('#app').innerHTML='';
  doc.querySelector('#embedded-data').textContent=JSON.stringify(DATA).replace(/</g,'\\u003c');
  if(await saveFile('family-tree-offline.html','<!DOCTYPE html>\n'+doc.outerHTML,'text/html'))toast('Offline copy saved. It opens in any browser, with no internet needed.',5000);
}

/* ---------- start ---------- */
function startScreen(msg){
  const app=$('#app');app.innerHTML='';
  const file=h('input',{type:'file',accept:'.json,application/json'});
  file.addEventListener('change',async()=>{const f=file.files[0];if(!f)return;try{init(JSON.parse(await f.text()));}catch(e){err.textContent='That file could not be read as a family tree.';}});
  const err=h('p',{class:'err'});
  app.append(h('div',{class:'start'},h('h1',{text:'Family Tree'}),
    h('p',{text:msg||'The tree data (family.json) could not be loaded. If you opened this page from a file on your computer, choose the family.json file:'}),file,err,
    h('p',{class:'muted',style:'margin-top:24px',text:'Or start from scratch:'}),btn('Start a new, empty tree',()=>{init(emptyData());toggleCustodian();openEditPerson(null);})),
    h('div',{id:'modal-root'}),h('div',{id:'toast',class:'toast'}));
}
function init(data){
  if(window.innerWidth<500)S.zoom=.85;
  DATA=normalize(data);BASE=clone(DATA);loadedStamp=DATA.updated||null;rebuildIndex();shell();document.title=DATA.title;
  const hid=decodeURIComponent(location.hash.slice(1));
  const start=P(hid)?hid:pickHome();
  if(start)setFocus(start);else{renderTree();renderSide();}
  checkDraft();
}
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(DATA&&P(id)&&id!==S.focus)setFocus(id);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
(async function boot(){
  let data=null;
  const emb=$('#embedded-data').textContent.trim();
  if(emb){try{data=JSON.parse(emb);}catch(e){}}
  if(!data){try{const r=await fetch('family.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}}
  if(data)init(data);else startScreen();
})();
</script>
